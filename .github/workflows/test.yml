name: Test
on:
  push:
    tags-ignore:
      - "*.*"
    branches:
      - "**"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      go_version: ${{ steps.go-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract Go version from go.mod
        id: go-version
        run: |
          GO_VERSION=$(make print-go-version)
          echo "Extracted Go version: $GO_VERSION"
          echo "version=$GO_VERSION" >> "$GITHUB_OUTPUT"

  test_on_machine:
    needs: setup
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2019]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: everestsystems/infra-tools
          ref: ${{ vars.INFRA_TOOLS_VERSION }}
          token: ${{ secrets.GPR_TOKEN }}
          path: infra-tools

      - name: Setup Go
        uses: ./infra-tools/.github/actions/setup-go/
        with:
          go-version: ${{ needs.setup.outputs.go_version }}

      - name: Export vars
        id: vars
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == ubuntu-* ]]; then
            echo "::set-output name=GOOS::linux"
          elif [[ "${{ matrix.os }}" == macos-* ]]; then
            echo "::set-output name=GOOS::darwin"
          else
            echo "::set-output name=GOOS::windows"
          fi

      - name: Build binary
        env:
          GOARCH: amd64
          GOOS: ${{ steps.vars.outputs.GOOS }}
        run: go build -o dist/$(echo "${{ runner.os }}" | tr "[:upper:]" "[:lower:]")
        shell: bash

      - name: Create temp files
        shell: bash
        run: |
          mkdir -p temp/{dir1,dir2,dir3}/{subdir1,subdir2,subdir3}
          echo "fileexample" > temp/file.txt
          cat temp/file.txt | tee temp/dir1/file.txt temp/dir2/file.txt temp/dir3/file.txt temp/dir1/subdir1/file.txt temp/dir2/subdir2/file.txt temp/dir3/subdir3/file.txt

      - name: Put cache
        uses: ./
        with:
          action: put
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          bucket: ${{ secrets.AWS_BUCKET }}
          key: ${{ hashFiles('action.yml') }}-${{ matrix.os }}
          artifacts: |
            temp/*

      - name: Remove temp folder
        shell: bash
        run: rm -rf temp

      - name: Get cache
        uses: ./
        with:
          action: get
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          bucket: ${{ secrets.AWS_BUCKET }}
          key: ${{ hashFiles('action.yml') }}-${{ matrix.os }}

      - name: List cache folder
        shell: bash
        run: ls temp

      - name: Delete cache
        uses: ./
        with:
          action: delete
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          bucket: ${{ secrets.AWS_BUCKET }}
          key: ${{ hashFiles('action.yml') }}-${{ matrix.os }}
