name: Test

on:
  pull_request:
    branches:
      - '*'

env:
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  LOCALSTACK_ENDPOINT: http://localhost:4566
  TEST_BUCKET: test-bucket

jobs:
  setup:
    runs-on: ubuntu-slim
    outputs:
      go_version: ${{ steps.go-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract Go version from go.mod
        id: go-version
        run: |
          GO_VERSION=$(make print-go-version)
          echo "Extracted Go version: $GO_VERSION"
          echo "version=$GO_VERSION" >> "$GITHUB_OUTPUT"

  test:
    needs: setup
    name: Test on Linux
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack
        ports:
          - 4566:4566
        env:
          SERVICES: s3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        # As this repo is a public fork the public setup-go action is used here instead of our private one
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.setup.outputs.go_version }}

      - name: Build binary
        run: go build -o dist/linux-x64

      - name: Create test bucket
        run: aws --endpoint-url=${{ env.LOCALSTACK_ENDPOINT }} s3 mb s3://${{ env.TEST_BUCKET }}

      - name: Create temp files
        run: |
          mkdir -p temp/{dir1,dir2,dir3}/{subdir1,subdir2,subdir3}
          echo "fileexample" > temp/file.txt
          cat temp/file.txt | tee temp/dir1/file.txt temp/dir2/file.txt temp/dir3/file.txt temp/dir1/subdir1/file.txt temp/dir2/subdir2/file.txt temp/dir3/subdir3/file.txt

      - name: Put cache
        uses: ./
        with:
          action: put
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          bucket: ${{ env.TEST_BUCKET }}
          key: test-cache-${{ github.run_id }}
          endpoint: ${{ env.LOCALSTACK_ENDPOINT }}
          artifacts: |
            temp/*

      - name: Remove temp folder
        run: rm -rf temp

      - name: Get cache
        uses: ./
        with:
          action: get
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          bucket: ${{ env.TEST_BUCKET }}
          key: test-cache-${{ github.run_id }}
          endpoint: ${{ env.LOCALSTACK_ENDPOINT }}

      - name: Verify cache restored
        run: |
          # Check all files exist
          test -f temp/file.txt
          test -f temp/dir1/file.txt
          test -f temp/dir2/file.txt
          test -f temp/dir3/file.txt
          test -f temp/dir1/subdir1/file.txt
          test -f temp/dir2/subdir2/file.txt
          test -f temp/dir3/subdir3/file.txt

          # Verify file contents
          for f in temp/file.txt temp/dir1/file.txt temp/dir2/file.txt temp/dir3/file.txt \
                   temp/dir1/subdir1/file.txt temp/dir2/subdir2/file.txt temp/dir3/subdir3/file.txt; do
            content=$(cat "$f")
            if [ "$content" != "fileexample" ]; then
              echo "ERROR: $f has wrong content: $content"
              exit 1
            fi
          done

          echo "All files restored correctly"

      - name: Delete cache
        uses: ./
        with:
          action: delete
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          bucket: ${{ env.TEST_BUCKET }}
          key: test-cache-${{ github.run_id }}
          endpoint: ${{ env.LOCALSTACK_ENDPOINT }}
